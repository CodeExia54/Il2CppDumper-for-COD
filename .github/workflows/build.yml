name: Build Il2CppDumper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ linux-x64, win-x64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore Il2CppDumper/Il2CppDumper.csproj

      # Self-contained, single-file: runs on a machine with NO .NET installed
      # (big — the .NET runtime is bundled in).
      - name: Publish self-contained (${{ matrix.rid }})
        run: >
          dotnet publish Il2CppDumper/Il2CppDumper.csproj
          -c Release -f net7.0 -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/self-contained/${{ matrix.rid }}

      # Framework-dependent: tiny (~1 MB), like the original release — REQUIRES
      # the .NET 7 runtime to be installed on the machine that runs it.
      - name: Publish framework-dependent (${{ matrix.rid }})
        run: >
          dotnet publish Il2CppDumper/Il2CppDumper.csproj
          -c Release -f net7.0 -r ${{ matrix.rid }}
          --self-contained false
          -o publish/framework-dependent/${{ matrix.rid }}

      - name: Upload self-contained artifact (no .NET needed)
        uses: actions/upload-artifact@v4
        with:
          name: Il2CppDumper-${{ matrix.rid }}-selfcontained
          path: publish/self-contained/${{ matrix.rid }}/*
          retention-days: 14

      - name: Upload framework-dependent artifact (needs .NET 7 runtime)
        uses: actions/upload-artifact@v4
        with:
          name: Il2CppDumper-${{ matrix.rid }}-fwdep
          path: publish/framework-dependent/${{ matrix.rid }}/*
          retention-days: 14
