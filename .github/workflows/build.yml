name: Build Il2CppDumper

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ linux-x64, win-x64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore Il2CppDumper/Il2CppDumper.csproj

      - name: Publish (self-contained ${{ matrix.rid }})
        run: >
          dotnet publish Il2CppDumper/Il2CppDumper.csproj
          -c Release -f net7.0 -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Il2CppDumper-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/*
          retention-days: 14
